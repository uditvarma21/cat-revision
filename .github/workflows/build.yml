name: Build Electron App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Add build script if missing
        run: |
          if (-Not (Select-String '"build":' package.json)) {
            (Get-Content package.json) -replace '"scripts": {', '"scripts": {`n    "build": "electron-builder",'
            | Set-Content package.json
          }

      - name: Install electron-builder
        run: npm install --save-dev electron-builder

      - name: Build app
        run: npm run build

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: electron-app
          path: dist/*.exe
